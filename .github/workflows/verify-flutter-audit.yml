name: Flutter audit verification

on:
  push:
    branches:
      - 'audit/**'
    paths:
      - 'pokemon100_flutter_prototype/pokemon100/**'
      - '.github/workflows/verify-flutter-audit.yml'

permissions:
  contents: write

concurrency:
  group: flutter-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pokemon100_flutter_prototype/pokemon100

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/screens/maps_screen.dart \
            lib/screens/achievements_screen.dart \
            lib/screens/profile_screen.dart \
            lib/screens/pokemon_music_screen.dart \
            lib/services/achievement_progress_service.dart \
            lib/services/pokemon_music_service.dart \
            test/achievement_progress_service_test.dart \
            test/lets_go_kanto_map_test.dart \
            test/pokemon_music_service_test.dart
          dart format --output=none --set-exit-if-changed \
            lib/screens/maps_screen.dart \
            lib/screens/achievements_screen.dart \
            lib/screens/profile_screen.dart \
            lib/screens/pokemon_music_screen.dart \
            lib/services/achievement_progress_service.dart \
            lib/services/pokemon_music_service.dart \
            test/achievement_progress_service_test.dart \
            test/lets_go_kanto_map_test.dart \
            test/pokemon_music_service_test.dart
          git diff --check
          git add \
            lib/screens/maps_screen.dart \
            lib/screens/achievements_screen.dart \
            lib/screens/profile_screen.dart \
            lib/screens/pokemon_music_screen.dart \
            lib/services/achievement_progress_service.dart \
            lib/services/pokemon_music_service.dart \
            test/achievement_progress_service_test.dart \
            test/lets_go_kanto_map_test.dart \
            test/pokemon_music_service_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format audit changes [skip ci]"
            git push origin "HEAD:${GITHUB_REF}"
          fi

      - name: Flutter Analyzer
        run: flutter analyze

      - name: Flutter tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-100-percent-audit-release-apk
          path: pokemon100_flutter_prototype/pokemon100/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
